name: Build GoogleAISearch Fabric Mod JAR
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Unzip and Build Fabric Mod
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "GoogleAISearchFabricMod*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE" -d extracted_mod
            cd extracted_mod
          fi
          gradle build --no-daemon
      - name: Upload Compiled Fabric Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: GoogleAISearch-Fabric-Mod
          path: "**/build/libs/google-ai-search-*.jar"
