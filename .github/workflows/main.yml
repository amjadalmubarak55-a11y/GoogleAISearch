name: Build GoogleAISearch Plugin JAR
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build JAR with Maven
        run: |
          POM_DIR=$(dirname $(find . -name pom.xml | head -n 1))
          mvn -B -f "$POM_DIR/pom.xml" clean package
      - name: Upload Compiled Plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: GoogleAISearch-JAR
          path: "**/target/GoogleAISearch-*.jar"
